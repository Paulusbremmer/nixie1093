<svg xmlns="http://www.w3.org/2000/svg"
     width="560mm" height="345mm"
     viewBox="0 0 560 345">
  <title>Nixie IN-8-2 Low-Profile Stacked Rounded-Corner Case (3mm, No Bending)</title>
  <desc>
    Nixie IN-8-2 Low-Profile Stacked Rounded-Corner Case (3.0 mm Multiplex / MDF / Acryl) — ZERO BENDING REQUIRED!
    - Outer Dimensions: 170.0 x 90.0 mm, R_out = 15.0 mm rounded corners
    - Total Height: 21.0 mm (with 5 rings) or 24.0 mm (with 6 rings)
    - Flush Drop-In Top Plate ("Los ingezette bovenplaat"): 164.0 x 84.0 mm, R = 12.0 mm
    - 4x IN-8-2 Tube Holes (Ø 20.0 mm) & 8x TAF1317A M2 Mounting Holes (Ø 2.1 mm)
    - 5x Hidden Ø 3.1 mm Alignment Dowel Holes in Layers 1..5 (for 3 mm wooden skewers/dowels — invisible from top & outside!)
  </desc>

