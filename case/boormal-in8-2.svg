  <title>Nixie IN-8-2 1:1 Boormal &amp; Markeersjabloon (Voor Massief Houten Behuizing)</title>
  <desc>
    1:1 Boormal voor 4x IN-8-2 Nixie buizen op 2 gekoppelde TAF1317A printplaten:
    - Buisdiameter: Ø 19.0 mm (Aanbevolen boorgat: Ø 20.0 mm Forstnerboor / kunstboor)
    - Hart-op-hart afstanden:
        Buis 1 naar Buis 2 : 25.30 mm
        Buis 2 naar Buis 3 : 47.70 mm
        Buis 3 naar Buis 4 : 25.30 mm
        Buis 1 naar Buis 4 : 98.30 mm (totaal hart-op-hart)
    - X-posities vanuit het exacte midden (0.00 mm): -49.15 mm, -23.85 mm, +23.85 mm, +49.15 mm
  </desc>

