<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="120mm" height="22mm"
     viewBox="0 0 120 22">
  <title>IN-8-2 Direct-Op-Hout Boor-Markering (Alleen 4x Ø20.0 mm Cirkels &amp; Centerpunten)</title>
  <desc>
    Bevat UITSLUITEND de 4x Ø 20.0 mm buiscirkels en de 4x centerpons-punten (hart-op-hart: 25.30 - 47.70 - 25.30 mm).
    Geen buitenkaders, geen tekst en geen lijnen buiten de 20 mm gaten, zodat er na het boren geen enkel laser-restant op het hout achterblijft.
  </desc>

  <!-- LAYER 01 (RED #FF0000): 4x CENTERPONS-PUNTEN (WORDT 100% WEGGEBOORD DOOR DE BOORPUNT) -->
  <g id="Layer_01_Center_Points" fill="none" stroke="#FF0000" stroke-width="0.15" stroke-linecap="round">
        <circle cx="10.850" cy="11.000" r="0.20"/>
    <circle cx="10.850" cy="11.000" r="0.55"/>
    <line x1="9.050" y1="11.000" x2="12.650" y2="11.000"/>
    <line x1="10.850" y1="9.200" x2="10.850" y2="12.800"/>
    <circle cx="36.150" cy="11.000" r="0.20"/>
    <circle cx="36.150" cy="11.000" r="0.55"/>
    <line x1="34.350" y1="11.000" x2="37.950" y2="11.000"/>
    <line x1="36.150" y1="9.200" x2="36.150" y2="12.800"/>
    <circle cx="83.850" cy="11.000" r="0.20"/>
    <circle cx="83.850" cy="11.000" r="0.55"/>
    <line x1="82.050" y1="11.000" x2="85.650" y2="11.000"/>
    <line x1="83.850" y1="9.200" x2="83.850" y2="12.800"/>
    <circle cx="109.150" cy="11.000" r="0.20"/>
    <circle cx="109.150" cy="11.000" r="0.55"/>
    <line x1="107.350" y1="11.000" x2="110.950" y2="11.000"/>
    <line x1="109.150" y1="9.200" x2="109.150" y2="12.800"/>
  </g>

  <!-- LAYER 02 (BLACK #000000): 4x Ø 20.0 mm BUIS-CIRKELS -->
  <g id="Layer_02_Tube_Circles_20mm" fill="none" stroke="#000000" stroke-width="0.15">
        <circle cx="10.850" cy="11.000" r="10.00"/>
    <circle cx="36.150" cy="11.000" r="10.00"/>
    <circle cx="83.850" cy="11.000" r="10.00"/>
    <circle cx="109.150" cy="11.000" r="10.00"/>
